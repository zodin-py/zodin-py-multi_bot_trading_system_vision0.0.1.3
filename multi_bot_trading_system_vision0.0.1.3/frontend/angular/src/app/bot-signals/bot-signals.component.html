<div class="card rounded-xl p-4">
  <h2 class="text-lg font-semibold mb-4">
    <i class="fas fa-robot mr-2 text-blue-400"></i>Bot Signale
  </h2>
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead>
        <tr class="text-left text-sm text-gray-400 border-b border-slate-700">
          <th class="pb-3">Bot</th>
          <th class="pb-3">Buy %</th>
          <th class="pb-3">Sell %</th>
          <th class="pb-3">Hold %</th>
          <th class="pb-3">Signal</th>
          <th class="pb-3">Letztes Update</th>
        </tr>
      </thead>
      <tbody class="text-sm">
        <tr *ngIf="rows.length === 0">
          <td colspan="6" class="py-4 text-center text-gray-500">Lade Daten...</td>
        </tr>
        <ng-container *ngFor="let row of rows">
          <tr class="border-b border-slate-700/50 hover:bg-slate-800/30">
            <td class="py-3 font-medium">{{ row.name }}</td>
            <td class="py-3">
              <div class="flex items-center">
                <div class="w-16 bg-slate-700 rounded-full h-2 mr-2">
                  <div class="progress-bar bg-green-500 h-2 rounded-full" [style.width.%]="row.buy"></div>
                </div>
                <span class="text-green-400">{{ row.buy }}%</span>
              </div>
            </td>
            <td class="py-3">
              <div class="flex items-center">
                <div class="w-16 bg-slate-700 rounded-full h-2 mr-2">
                  <div class="progress-bar bg-red-500 h-2 rounded-full" [style.width.%]="row.sell"></div>
                </div>
                <span class="text-red-400">{{ row.sell }}%</span>
              </div>
            </td>
            <td class="py-3">
              <div class="flex items-center">
                <div class="w-16 bg-slate-700 rounded-full h-2 mr-2">
                  <div class="progress-bar bg-yellow-500 h-2 rounded-full" [style.width.%]="row.hold"></div>
                </div>
                <span class="text-yellow-400">{{ row.hold }}%</span>
              </div>
            </td>
            <td class="py-3 font-medium" [class]="getSignalClass(row.signal)">
              {{ getSignalText(row.signal) }}
            </td>
            <td class="py-3 text-gray-400">{{ row.timestamp }}</td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
