<div class="card rounded-xl p-4">
  <h2 class="text-lg font-semibold mb-4">
    <i class="fas fa-shield-alt mr-2 text-orange-400"></i>Risikomanagement
  </h2>
  <div class="flex items-center space-x-4">
    <div class="flex items-center space-x-2">
      <input
        [(ngModel)]="riskLimit"
        type="number"
        step="0.1"
        min="0.1"
        class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm w-24 focus:outline-none focus:border-blue-500"
      />
      <button
        (click)="saveRiskLimit()"
        [disabled]="saving"
        class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 px-3 py-2 rounded-lg text-sm font-medium transition-colors"
      >
        <i class="fas fa-save mr-1"></i>Speichern
      </button>
    </div>
    <span class="text-sm" [class]="statusClass">{{ statusText }}</span>
  </div>

  <!-- Halted badge moved here so the KPI grid stays 4 columns -->
  <div *ngIf="isHalted" class="mt-3">
    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-500/20 text-red-400">
      <i class="fas fa-exclamation-triangle mr-1"></i>Trading gestoppt
    </span>
  </div>
</div>
