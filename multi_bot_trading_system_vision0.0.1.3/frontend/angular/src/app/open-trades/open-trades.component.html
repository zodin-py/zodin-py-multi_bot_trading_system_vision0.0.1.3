<div class="card rounded-xl p-4">
  <h2 class="text-lg font-semibold mb-4">
    <i class="fas fa-ticket-alt mr-2 text-yellow-400"></i>Offene Trades
  </h2>
  <div class="overflow-x-auto max-h-80 scrollbar-thin">
    <table class="w-full">
      <thead>
        <tr class="text-left text-sm text-gray-400 border-b border-slate-700">
          <th class="pb-2">ID</th>
          <th class="pb-2">Symbol</th>
          <th class="pb-2">Side</th>
          <th class="pb-2">Entry</th>
          <th class="pb-2">SL</th>
          <th class="pb-2">TP</th>
          <th class="pb-2">Aktion</th>
        </tr>
      </thead>
      <tbody class="text-sm">
        <tr *ngIf="displayTrades.length === 0">
          <td colspan="7" class="py-4 text-center text-gray-500">Keine offenen Trades</td>
        </tr>
        <tr *ngFor="let trade of displayTrades" class="border-b border-slate-700/50">
          <td class="py-2">{{ getTradeId(trade) }}</td>
          <td class="py-2">{{ trade.symbol }}</td>
          <td class="py-2" [class]="getSideClass(trade.side)">
            {{ getSideText(trade.side) }}
          </td>
          <td class="py-2">{{ trade.entry_price?.toFixed(2) ?? '--' }}</td>
          <td class="py-2 text-red-400">{{ trade.stop_loss?.toFixed(2) ?? '--' }}</td>
          <td class="py-2 text-green-400">{{ trade.take_profit?.toFixed(2) ?? '--' }}</td>
          <td class="py-2">
            <button
              (click)="close.emit(getTradeId(trade))"
              class="text-red-400 hover:text-red-300"
            >
              <i class="fas fa-times"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
