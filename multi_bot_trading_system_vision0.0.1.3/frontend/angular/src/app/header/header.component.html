<header class="bg-slate-900/80 border-b border-slate-700 sticky top-0 z-50">
  <div class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo + Title -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2">
          <i class="fas fa-chart-line text-2xl text-blue-400"></i>
          <h1 class="text-xl font-bold">Multi-Bot Trading System</h1>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center space-x-4">
        <!-- Coin Input -->
        <div class="relative">
          <input
            type="text"
            [(ngModel)]="symbol"
            (input)="onCoinChange()"
            placeholder="Coin (z.B. BTC)"
            list="coin-suggestions"
            class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 w-40"
          />
          <datalist id="coin-suggestions">
            <option *ngFor="let c of suggestedCoins" [value]="c"></option>
          </datalist>
        </div>

        <!-- Timeframe Selection -->
        <select
          [(ngModel)]="timeframe"
          (change)="onTimeframeChange()"
          class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
        >
          <option *ngFor="let tf of timeframes" [value]="tf.value">
            {{ tf.label }}
          </option>
        </select>
      </div>
    </div>
  </div>
</header>
